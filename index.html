<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendFit Feminina</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

header{
display:flex;
justify-content:space-between;
padding:20px;
background:#111;
border-bottom:2px solid #c0c0c0;
}

.logo{
color:#c0c0c0;
font-size:26px;
font-weight:bold;
}

nav a{
color:#fff;
margin-left:15px;
text-decoration:none;
}

nav a:hover{
color:#c0c0c0;
}

.hero{
height:70vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438');
background-size:cover;
}

.hero h1{
font-size:50px;
color:#c0c0c0;
}

.btn{
background:#c0c0c0;
color:#000;
padding:12px 25px;
text-decoration:none;
font-weight:bold;
display:inline-block;
margin-top:10px;
border-radius:5px;
}

.sec{
padding:50px 10%;
}

h1,h2{
text-align:center;
color:#c0c0c0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#111;
padding:15px;
border:1px solid #c0c0c0;
text-align:center;
border-radius:8px;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:6px;
margin-bottom:10px;
}

button{
margin-top:10px;
padding:10px;
background:#c0c0c0;
border:none;
cursor:pointer;
font-weight:bold;
}

form{
display:flex;
flex-direction:column;
gap:10px;
max-width:400px;
margin:auto;
}

input,textarea{
padding:10px;
border:none;
border-radius:5px;
}

footer{
text-align:center;
padding:20px;
background:#111;
border-top:1px solid #c0c0c0;
margin-top:40px;
}
</style>
</head>

<body>

<header>
  <div class="logo">TrendFit</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#produtos">Produtos</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>TrendFit Feminina</h1>
    <p>Força, estilo e conforto para seus treinos</p>
    <a class="btn" href="#produtos">Ver Produtos</a>
  </div>
</section>

<section class="sec" id="produtos">
<h2>Produtos</h2>

<div class="grid">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438">
    <h3>Legging Silver</h3>
    <p>R$ 129,90</p>
    <button>Comprar</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
    <h3>Top Fitness</h3>
    <p>R$ 89,90</p>
    <button>Comprar</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1514996937319-344454492b37">
    <h3>Conjunto Elite</h3>
    <p>R$ 199,90</p>
    <button>Comprar</button>
  </div>

</div>
</section>

<section class="sec" id="contato">
<h2>Contato</h2>

<form onsubmit="event.preventDefault(); alert('Mensagem enviada!');">
  <input type="text" placeholder="Seu nome" required>
  <input type="email" placeholder="Seu email" required>
  <textarea placeholder="Sua mensagem"></textarea>
  <button type="submit">Enviar</button>
</form>
</section>

<footer>
<p>© 2026 TrendFit</p>
</footer>

</body>
</html>
